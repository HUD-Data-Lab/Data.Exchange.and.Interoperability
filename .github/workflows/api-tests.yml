name: API contract tests

on:
  push:
    paths:
      - "api/**"
      - "FY26_HMIS_Logic_Model.ttl"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "FY26_HMIS_Logic_Model.ttl"
      - ".github/workflows/api-tests.yml"

jobs:
  newman:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Hosted macOS runners are often short on capacity; a job that is never
    # picked up should not mark the whole run red. Ubuntu and Windows still gate.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        working-directory: api/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results-${{ matrix.os }}
          path: api/tests/build/
