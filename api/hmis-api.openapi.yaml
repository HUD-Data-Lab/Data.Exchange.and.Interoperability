        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchClientsbyProjectTypeorFunderTypeRequest'
            examples:
              default:
                $ref: '#/components/examples/SearchClientsbyProjectTypeorFunderTypeRequestExample'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
