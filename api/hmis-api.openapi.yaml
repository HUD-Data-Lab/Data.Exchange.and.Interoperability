      x-hmis-scenario: 8
      x-source: Artifacts/CommonScenariosJSON/FY2026/ClientFullHMISRecord.json
      description: Change-window filters apply to DateCreated, DateUpdated and DateDeleted.
      requestBody:
        required: true
