# Generated from Artifacts/CommonScenariosJSON/FY2026 by consolidating the eight scenario files.
openapi: 3.1.1
info:
  title: HMIS Data Exchange API
  version: FY2026-proposed
  summary: Baseline HMIS data exchange scenarios, consolidated from Artifacts/CommonScenariosJSON/FY2026.
  description: 'Proposed consolidation of the eight FY2026 common scenario request/response pairs into one OpenAPI 3.1 document.
    Field schemas are kept verbatim from the source files and shared through components/schemas. Paths and methods follow
    the baseline scenarios in the HMIS API Reference Guide; they are proposals, since the source files define operations but
    not URLs.


    Every request and response object carries an `x-jsonld-context` that maps each JSON field to its term in the HMIS Logic
    Model ontology (`urn:hud:hmis:owl#`, FY26_HMIS_Logic_Model.ttl). Adding that context as `@context` turns a payload into
    linked data, so the ontology itself stays API-free.


    Examples are illustrative values generated from the schemas, not real client data.'
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- url: http://localhost:4010
  description: Local mock server used by api/tests (Prism)
- url: https://{host}/hmis/v1
  description: HMIS vendor implementation
  variables:
    host:
      default: hmis.example.org
tags:
- name: Scenario 1
  description: Search for a client record by identifying information or PersonalID
- name: Scenario 2
  description: Generate a new client record
- name: Scenario 3
  description: Update an existing client record
- name: Scenario 4
  description: Generate a list of enrollments related to a single project
- name: Scenario 5
  description: Generate a list of enrollments related to a single client
- name: Scenario 6
  description: Generate a list of projects filtered by funder and project type
- name: Scenario 7
  description: Generate a list of clients filtered by funder and project type
- name: Scenario 8
  description: Comprehensive return of all of a person's services and data changes
paths:
  /clients/search:
    post:
      operationId: SearchforClient
      summary: Search for a client record by identifying information or PersonalID
      tags:
      - Scenario 1
      x-hmis-scenario: 1
      x-source: Artifacts/CommonScenariosJSON/FY2026/SearchForClient.json
      description: Uses POST so that identifying information stays out of URLs and system logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchforClientRequest'
            examples:
              default:
                $ref: '#/components/examples/SearchforClientRequestExample'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchforClientResponse'
              examples:
                default:
                  $ref: '#/components/examples/SearchforClientResponseExample'
  /clients:
    post:
      operationId: CreateClient
      summary: Generate a new client record
      tags:
      - Scenario 2
      x-hmis-scenario: 2
      x-source: Artifacts/CommonScenariosJSON/FY2026/CreateClient.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateClientRequestExample'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
              examples:
                default:
                  $ref: '#/components/examples/CreateClientResponseExample'
  /clients/{PersonalID}:
    patch:
      operationId: UpdateClient
      summary: Update an existing client record
      tags:
      - Scenario 3
      x-hmis-scenario: 3
      x-source: Artifacts/CommonScenariosJSON/FY2026/UpdateClient.json
      description: 'The source scenario defines no request fields yet (see DataExchangeScenarioList: no UpdateClientRequest
        column).'
      parameters:
      - name: PersonalID
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PersonalID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
            examples:
              default:
                $ref: '#/components/examples/UpdateClientRequestExample'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateClientResponse'
              examples:
                default:
                  $ref: '#/components/examples/UpdateClientResponseExample'
  /projects/enrollments/search:
    post:
      operationId: ClientsinaProject
      summary: Generate a list of enrollments related to a single project
      tags:
      - Scenario 4
      x-hmis-scenario: 4
      x-source: Artifacts/CommonScenariosJSON/FY2026/ClientsInProject.json
      description: Filter by ProjectID, EntryDate and ExitDate.
      requestBody:
